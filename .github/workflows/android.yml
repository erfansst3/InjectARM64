name: Kossher Hook + Detector Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_SDK_ROOT"
            find "$ANDROID_SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          export PATH="$(dirname "$SDKMANAGER"):$PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.3.11579264"
      - name: Build
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle :app:assembleDebug :reader:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kossher-detector
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kossher-buffer-reader
          path: reader/build/outputs/apk/debug/*.apk
      - name: Collect native library
        shell: bash
        run: |
          set -e
          mkdir -p artifacts
          SO="$(find app/build -type f -name libmyhook.so -path '*/arm64-v8a/*' -print -quit)"
          if [ -z "$SO" ]; then
            echo "libmyhook.so not found"
            find app/build -type f -name 'libmyhook.so' -print || true
            exit 1
          fi
          cp "$SO" artifacts/libmyhook-arm64-v8a.so
          ls -l artifacts/libmyhook-arm64-v8a.so
      - uses: actions/upload-artifact@v4
        with:
          name: injectarm64-native-hook
          path: artifacts/libmyhook-arm64-v8a.so
