name: Android Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.3.11579264"
      - run: curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip && unzip -q /tmp/gradle.zip -d /tmp
      - run: /tmp/gradle-8.7/bin/gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: proc-maps-detector
          path: app/build/outputs/apk/debug/*.apk